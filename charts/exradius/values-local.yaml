# A local kind cluster made by `make -C deploy/kind dev-up` (docs/kubernetes.md §17): the
# images come from the kind registry, Postgres, RabbitMQ and SeaweedFS run in the cluster,
# and everything is small. Tilt (the Tiltfile) installs the chart with these values and
# replaces the images with the ones it builds.

publicApiUrl: http://localhost:8100

images:
  registry: kind-registry:5000

broker:
  # Tilt forwards RabbitMQ to localhost:5673 (5672 is the v0.1.0 compose stack's).
  publicHost: localhost
  publicPort: 5673

rabbitmq:
  inCluster:
    operator: true
    storage: 1Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 512Mi}

postgres:
  inCluster:
    cloudnativepg: true
    storage: 1Gi

objectStore:
  s3:
    existingSecret: exradius-objectstore
  inCluster:
    seaweedfs: true
    storage: 5Gi

api:
  # Tilt syncs Python files into the running containers.
  readOnlyRootFilesystem: false
worker:
  readOnlyRootFilesystem: false
  concurrency: 4

runs:
  defaults: {memoryRequest: 512Mi, cpuRequest: 250m, serviceMemoryRequest: 128Mi, serviceCpuRequest: 50m}
  workspace: {size: 10Gi}
  # One node: ReadWriteOnce is shared by every run of a project.
  projectVolume: {size: 20Gi}
  # As the chart default. For gVisor (make -C deploy/kind dev-gvisor) set
  # runtimeClassName: gvisor and userNamespaces: false.
  userNamespaces: true

egress:
  # Build pods push to the kind registry through the proxy; it is on kind's Docker network.
  allowPrivate: [kind-registry:5000]
  logLevel: debug

builds:
  # The kind registry (deploy/kind/dev-up.sh), over HTTP; the node's containerd pulls from it
  # through its hosts.toml.
  registry: kind-registry:5000
  insecureRegistries: [kind-registry:5000]
  # Installed on the node by dev-up (make -C deploy/kind dev-seccomp): exradius-builds runs
  # at Pod Security baseline.
  seccompProfile: exradius/buildkit.json
  resources:
    requests: {cpu: 250m, memory: 512Mi}
