---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  name: builds.exradius.dev
spec:
  group: exradius.dev
  names:
    kind: Build
    listKind: BuildList
    plural: builds
    singular: build
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Build is one image built from a Dockerfile in a config repository by a single-use
          rootless BuildKit pod. Builds are kept: a succeeded Build means the image exists.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BuildSpec is one image to build from a context the api serves (docs/kubernetes.md §12).
              The worker writes it; nothing in it can change the build pod's security.
            properties:
              cache:
                description: |-
                  Cache is the registry reference of the layer cache (exported with mode=max and
                  imported); empty: no cache.
                type: string
              dockerfile:
                description: Dockerfile is the Dockerfile's path inside the context.
                minLength: 1
                type: string
              id:
                description: |-
                  ID is the image build's id: the internal API path of its context
                  (/internal/builds/{id}/context).
                minLength: 1
                type: string
              image:
                description: Image is the reference pushed when the build succeeds,
                  with its tag.
                minLength: 1
                type: string
              name:
                description: Name is workstation or the service's name.
                minLength: 1
                type: string
              project:
                minLength: 1
                type: string
              secretName:
                description: SecretName is the Secret with the build's token (key
                  token), in the Build's namespace.
                minLength: 1
                type: string
            required:
            - dockerfile
            - id
            - image
            - name
            - project
            - secretName
            type: object
          status:
            description: BuildStatus is the build pod's outcome, written by the operator
              only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configErrorSince:
                format: date-time
                type: string
              digest:
                description: Digest is the pushed image's manifest digest.
                type: string
              finishedAt:
                format: date-time
                type: string
              log:
                description: Log is the last 4000 characters of the build's log, refreshed
                  while it runs.
                type: string
              message:
                type: string
              nodeName:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending (not scheduled), Running, Succeeded
                  or Failed. Final phases stay.
                type: string
              podName:
                type: string
              pullFailures:
                items:
                  description: PullFailure counts the failed pulls of one container's
                    image.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    container:
                      type: string
                    image:
                      type: string
                    lastReason:
                      description: LastReason is the waiting reason last seen, so
                        an attempt is counted once.
                      type: string
                    message:
                      type: string
                  required:
                  - attempts
                  - container
                  type: object
                type: array
              reason:
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
