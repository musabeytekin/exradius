---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  name: runs.exradius.dev
spec:
  group: exradius.dev
  names:
    kind: Run
    listKind: RunList
    plural: runs
    singular: run
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.taskId
      name: Task
      type: string
    - jsonPath: .spec.purpose
      name: Purpose
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Run is one execution of an agent task, a project verification
          or a provider probe.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunSpec is a normalised, secret-free description of one execution. The worker writes
              it from a project's config; the operator turns it into a pod.
            properties:
              cancel:
                description: Cancel deletes the pod and creates no other.
                type: boolean
              git:
                description: GitSpec is git configuration at the command-line level,
                  computed by the worker.
                properties:
                  env:
                    description: Env reaches the workstation container.
                    items:
                      description: 'EnvVar is one environment variable: a literal
                        value, or a key of the Run''s Secret.'
                      properties:
                        name:
                          minLength: 1
                          type: string
                        secretKey:
                          description: SecretKey names a key of spec.secretName.
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: value and secretKey are exclusive
                        rule: '!(has(self.value) && has(self.secretKey))'
                    type: array
                  setupEnv:
                    description: SetupEnv reaches the setup containers.
                    items:
                      description: 'EnvVar is one environment variable: a literal
                        value, or a key of the Run''s Secret.'
                      properties:
                        name:
                          minLength: 1
                          type: string
                        secretKey:
                          description: SecretKey names a key of spec.secretName.
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: value and secretKey are exclusive
                        rule: '!(has(self.value) && has(self.secretKey))'
                    type: array
                type: object
              id:
                description: 'ID is the run, verification or provider test id: the
                  internal API path.'
                minLength: 1
                type: string
              model:
                description: Model is the probe's model; empty is the runtime's default.
                type: string
              podGeneration:
                description: PodGeneration is bumped by the worker to recreate a lost
                  pod on the same workspace.
                format: int64
                minimum: 0
                type: integer
              project:
                type: string
              purpose:
                description: Purpose says what a Run is for.
                enum:
                - task
                - verify
                - probe
                type: string
              repositories:
                items:
                  description: RepositorySpec is one repository cloned into /work/<folder>.
                  properties:
                    branch:
                      description: Branch to check out; empty is the remote's default
                        branch.
                      type: string
                    credentialKey:
                      description: CredentialKey names the Secret key with the clone
                        credential; empty is anonymous.
                      type: string
                    folder:
                      minLength: 1
                      type: string
                    push:
                      type: boolean
                    url:
                      minLength: 1
                      type: string
                  required:
                  - folder
                  - url
                  type: object
                type: array
              runtime:
                description: RuntimeSpec is the agent runtime and its bundle image.
                properties:
                  env:
                    description: Env reaches the workstation container only (provider
                      variables).
                    items:
                      description: 'EnvVar is one environment variable: a literal
                        value, or a key of the Run''s Secret.'
                      properties:
                        name:
                          minLength: 1
                          type: string
                        secretKey:
                          description: SecretKey names a key of spec.secretName.
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: value and secretKey are exclusive
                        rule: '!(has(self.value) && has(self.secretKey))'
                    type: array
                  image:
                    description: Image of the runtime bundle, mounted read-only at
                      /opt/exradius/runtime as an image volume.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the runtime, for example claude_code.
                    minLength: 1
                    type: string
                required:
                - image
                - name
                type: object
              secretName:
                description: SecretName is the per-run Secret, in the Run's namespace.
                minLength: 1
                type: string
              taskId:
                type: string
              workstation:
                description: WorkstationSpec is the container the agent works in,
                  and its setup commands.
                properties:
                  caches:
                    description: Caches are accepted and not used yet (the project
                      volume comes later).
                    items:
                      type: string
                    type: array
                  env:
                    description: Env is the project's environment, for setup commands
                      and the workstation.
                    items:
                      description: 'EnvVar is one environment variable: a literal
                        value, or a key of the Run''s Secret.'
                      properties:
                        name:
                          minLength: 1
                          type: string
                        secretKey:
                          description: SecretKey names a key of spec.secretName.
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: value and secretKey are exclusive
                        rule: '!(has(self.value) && has(self.secretKey))'
                    type: array
                  image:
                    minLength: 1
                    type: string
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory becomes request and limit of the workstation
                      and setup containers.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  setup:
                    description: Setup commands, one init container each, in order
                      (/bin/sh -c).
                    items:
                      type: string
                    type: array
                required:
                - image
                type: object
            required:
            - id
            - purpose
            - runtime
            - secretName
            - workstation
            type: object
          status:
            description: RunStatus is the live execution, written by the operator
              only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configErrorSince:
                description: |-
                  ConfigErrorSince is when a container of the current pod was first seen waiting
                  with CreateContainerConfigError.
                format: date-time
                type: string
              message:
                type: string
              nodeName:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the Run's place in its pod's life.
                type: string
              podGeneration:
                description: PodGeneration is the generation of the pod last created.
                format: int64
                type: integer
              podName:
                type: string
              pullFailures:
                items:
                  description: PullFailure counts the failed pulls of one container's
                    image.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    container:
                      type: string
                    image:
                      type: string
                    lastReason:
                      description: LastReason is the waiting reason last seen, so
                        an attempt is counted once.
                      type: string
                    message:
                      type: string
                  required:
                  - attempts
                  - container
                  type: object
                type: array
              reason:
                type: string
              steps:
                description: Steps are the pod's init containers in order, without
                  the files sidecar.
                items:
                  description: Step is one init container of the pod.
                  properties:
                    container:
                      type: string
                    exitCode:
                      format: int32
                      type: integer
                    finishedAt:
                      format: date-time
                      type: string
                    log:
                      description: Log is the last 4000 characters of the container's
                        log, read when it ended.
                      type: string
                    name:
                      type: string
                    reason:
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    state:
                      description: StepState is the state of one step.
                      type: string
                  required:
                  - container
                  - name
                  - state
                  type: object
                type: array
              workstation:
                description: ContainerState is the workstation container's state.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  log:
                    type: string
                  message:
                    type: string
                  reason:
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  state:
                    description: State is waiting, running or terminated.
                    type: string
                required:
                - state
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
