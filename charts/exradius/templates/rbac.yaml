{{- /* ServiceAccounts and RBAC (docs/kubernetes.md §3). The worker asks for Runs and Builds
and writes their Secrets but cannot create pods or read Secrets; the operator creates pods
and PVCs in the runs namespace and pods in the builds namespace and has no Secret rights;
the api and the frontend have no rights. */ -}}
{{- $runs := .Values.namespaces.runs -}}
{{- $builds := .Values.namespaces.builds -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-api
  labels:
    {{- include "exradius.componentLabels" (list . "api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-frontend
  labels:
    {{- include "exradius.componentLabels" (list . "frontend") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-worker
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-operator
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
---
# Run pods: no Kubernetes identity at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-run
  namespace: {{ $runs }}
  labels:
    {{- include "exradius.componentLabels" (list . "run") | nindent 4 }}
automountServiceAccountToken: false
---
# Build pods: no Kubernetes identity either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exradius-build
  namespace: {{ $builds }}
  labels:
    {{- include "exradius.componentLabels" (list . "build") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-worker
  namespace: {{ $runs }}
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
rules:
  - apiGroups: [exradius.dev]
    resources: [runs]
    verbs: [get, list, watch, create, patch, delete]
  # Create and delete per-run Secrets; never read them.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-worker
  namespace: {{ $runs }}
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-worker
subjects:
  - kind: ServiceAccount
    name: exradius-worker
    namespace: {{ .Release.Namespace }}
---
# Builds and their token Secrets (never read).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-worker
  namespace: {{ $builds }}
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
rules:
  - apiGroups: [exradius.dev]
    resources: [builds]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-worker
  namespace: {{ $builds }}
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-worker
subjects:
  - kind: ServiceAccount
    name: exradius-worker
    namespace: {{ .Release.Namespace }}
---
# The operator's leader Lease, read for system status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-worker
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [exradius-operator]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-worker
  labels:
    {{- include "exradius.componentLabels" (list . "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-worker
subjects:
  - kind: ServiceAccount
    name: exradius-worker
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-operator
  namespace: {{ $runs }}
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [exradius.dev]
    resources: [runs]
    verbs: [get, list, watch]
  - apiGroups: [exradius.dev]
    resources: [runs/status]
    verbs: [get, update, patch]
  # Owned pods and PVCs carry blockOwnerDeletion (a controller reference).
  - apiGroups: [exradius.dev]
    resources: [runs/finalizers]
    verbs: [update]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-operator
  namespace: {{ $runs }}
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-operator
subjects:
  - kind: ServiceAccount
    name: exradius-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-operator
  namespace: {{ $builds }}
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [exradius.dev]
    resources: [builds]
    verbs: [get, list, watch]
  - apiGroups: [exradius.dev]
    resources: [builds/status]
    verbs: [get, update, patch]
  - apiGroups: [exradius.dev]
    resources: [builds/finalizers]
    verbs: [update]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-operator
  namespace: {{ $builds }}
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-operator
subjects:
  - kind: ServiceAccount
    name: exradius-operator
    namespace: {{ .Release.Namespace }}
---
# Leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exradius-operator
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exradius-operator
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exradius-operator
subjects:
  - kind: ServiceAccount
    name: exradius-operator
    namespace: {{ .Release.Namespace }}
