{{- /* The CRDs generated by controller-gen from operator/ (`make -C operator manifests`),
shipped as templates so `helm upgrade` upgrades them; each carries
helm.sh/resource-policy: keep, so an uninstall never deletes the Runs. */ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
