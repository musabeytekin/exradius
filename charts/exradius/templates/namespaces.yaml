{{- /* The runs and builds namespaces (docs/kubernetes.md §3.1). The release namespace is the
installer's, labelled pod-security.kubernetes.io/enforce=restricted. */ -}}
{{- if .Values.namespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.runs }}
  labels:
    {{- include "exradius.labels" . | nindent 4 }}
    # Services run as their image's user, often root: baseline, with restricted warned.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.builds }}
  labels:
    {{- include "exradius.labels" . | nindent 4 }}
    # Rootless BuildKit needs seccomp and AppArmor unconfined (phase 2; phase 5 checks
    # whether user namespaces let it drop to baseline).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
{{- end }}
