{{- /* The operator (docs/kubernetes.md §3, §5, §12): turns Runs into pods and Builds into build
pods. Holds nothing secret; its flags carry everything run and build pods get from values
(operator/cmd). */ -}}
{{- $runs := .Values.runs -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exradius-operator
  labels:
    {{- include "exradius.componentLabels" (list . "operator") | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "exradius.selector" (list . "operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exradius.componentLabels" (list . "operator") | nindent 8 }}
    spec:
      serviceAccountName: exradius-operator
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "exradius.image" (list . .Values.images.operator) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --runs-namespace={{ .Values.namespaces.runs }}
            - --api-url={{ include "exradius.internalApiUrl" . }}
            - --run-uid={{ int $runs.user.uid }}
            - --run-gid={{ int $runs.user.gid }}
            - --identity-configmap=exradius-run-identity
            - --service-account=exradius-run
            - --workspace-size={{ $runs.workspace.size }}
            - --workspace-storage-class={{ $runs.workspace.storageClass }}
            - --memory-request={{ $runs.defaults.memoryRequest }}
            - --cpu-request={{ $runs.defaults.cpuRequest }}
            - --service-memory-request={{ $runs.defaults.serviceMemoryRequest }}
            - --service-cpu-request={{ $runs.defaults.serviceCpuRequest }}
            - --project-volume={{ $runs.projectVolume.enabled }}
            - --project-volume-access-mode={{ $runs.projectVolume.accessMode }}
            - --project-volume-storage-class={{ $runs.projectVolume.storageClass }}
            - --project-volume-size={{ $runs.projectVolume.size }}
            - --runtime-class-name={{ $runs.runtimeClassName }}
            - --user-namespaces={{ $runs.userNamespaces }}
            - --node-selector={{ $runs.nodeSelector | default dict | toJson }}
            - --tolerations={{ $runs.tolerations | default list | toJson }}
            - --image-pull-secrets={{ join "," $runs.imagePullSecrets }}
            - --egress-proxy={{ include "exradius.egressProxy" . }}
            - --egress-url={{ include "exradius.egressUrl" . }}
            - --egress-peers={{ include "exradius.serviceHost" (list . "exradius-egress-pods") }}
            - --build-egress={{ .Values.builds.egress }}
            - --builds-namespace={{ .Values.namespaces.builds }}
            - --builder-image={{ .Values.builds.builderImage }}
            - --build-service-account=exradius-build
            - --buildkitd-configmap={{ if .Values.builds.insecureRegistries }}exradius-buildkitd{{ end }}
            - --build-resources={{ .Values.builds.resources | default dict | toJson }}
            - --build-seccomp-profile={{ .Values.builds.seccompProfile }}
            - --workers={{ .Values.operator.workers }}
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --leader-election-id=exradius-operator
            - --leader-election-namespace={{ .Release.Namespace }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "exradius.containerSecurity" true | nindent 12 }}
