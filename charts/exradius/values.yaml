# Exradius chart defaults (docs/kubernetes.md §16). Secrets are never values: each one is
# named by an existingSecret and read from there.

# Base URL of the API as consumers of task.result reach it (artifact and transcript links).
publicApiUrl: http://localhost:8000
clusterDomain: cluster.local

images:
  # Prefixed to every Exradius image: kind-registry:5000, <account>.dkr.ecr.<region>.amazonaws.com
  registry: ""
  # Tag of every Exradius image; empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  backend: exradius-backend
  frontend: exradius-frontend
  operator: exradius-operator
  egress: exradius-egress

runtime:
  claudeCode:
    # The Claude Code runtime bundle, mounted into run pods as an image volume.
    # Empty: <images.registry>/exradius-runtime-claude-code:<tag>.
    image: ""
# The image of run pods of projects that name none, and of provider probes.
# Empty: <images.registry>/exradius-project-default:<tag>.
projectDefaultImage: ""

secretKey:
  # A Fernet key (exradius generate-key) that encrypts secrets at rest.
  existingSecret: exradius-secret-key
  key: secret-key
admin:
  username: admin
  # Seeds the admin user at the first start; changed in the panel after that.
  existingSecret: exradius-admin
  key: password

broker:
  # amqp://host:5672/ of a broker outside the cluster. Empty with rabbitmq.inCluster.operator.
  url: ""
  # Secret with the broker's user name and password (in-cluster: <name>-default-user).
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  # The broker as integrations reach it, shown on the integration page.
  publicHost: localhost
  publicPort: 5672

rabbitmq:
  inCluster:
    # A RabbitmqCluster for the RabbitMQ Cluster Operator, which must be installed.
    operator: true
    name: exradius-rabbitmq
    replicas: 1
    storage: 10Gi
    storageClass: ""
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 1Gi}

postgres:
  # Secret whose uriKey holds the database URL (postgresql://user:password@host:5432/db).
  # Empty with inCluster.cloudnativepg: CloudNativePG's <name>-app Secret.
  existingSecret: ""
  uriKey: uri
  inCluster:
    # A CloudNativePG Cluster; the CloudNativePG operator must be installed.
    cloudnativepg: true
    name: exradius-postgres
    instances: 1
    storage: 10Gi
    storageClass: ""
    resources: {}

objectStore:
  kind: s3
  bucket: exradius
  region: us-east-1
  s3:
    # Empty: AWS S3 (or the in-cluster SeaweedFS below).
    endpoint: ""
    # Secret with an access key and a secret key. In-cluster SeaweedFS uses it too.
    existingSecret: exradius-objectstore
    accessKeyKey: accessKey
    secretKeyKey: secretKey
  inCluster:
    seaweedfs: true
    name: exradius-seaweedfs
    image: chrislusf/seaweedfs:4.51
    storage: 20Gi
    storageClass: ""
    resources: {}

api:
  replicas: 1
  resources: {}
  readOnlyRootFilesystem: true
worker:
  replicas: 1
  # Runs in flight per worker; RabbitMQ keeps the backlog.
  concurrency: 4
  resources: {}
  readOnlyRootFilesystem: true
frontend:
  replicas: 1
  resources: {}
operator:
  replicas: 1
  # Runs reconciled at once.
  workers: 4
  leaderElect: true
  resources: {}

# The egress proxy (docs/kubernetes.md §11): every request of run and build pods goes
# through it. Setup (clones, services, setup commands) and builds reach any public host;
# the agent reaches its model, its repositories, its connections and the hosts below plus
# each config's network.allow. Credentials stay in the proxy.
egress:
  replicas: 1
  # Hosts every run may reach in the agent phase (pypi.org; *.example.com for subdomains).
  allow: []
  # Private and cluster-internal destinations the proxy may reach: CIDRs, or host[:port].
  # Everything private (10/8, 172.16/12, 192.168/16, loopback, link-local, the cloud's
  # metadata address) is refused otherwise, in every phase. An internal package mirror, or
  # the kind registry for builds, goes here.
  allowPrivate: []
  # A corporate proxy every outbound connection goes through, http://host:port, and the
  # hosts reached without it. With credentials, name a Secret whose key holds the URL.
  upstreamProxy: ""
  upstreamProxySecret: {name: "", key: url}
  upstreamNoProxy: []
  # A ConfigMap with the CA of an intercepting upstream proxy, for the proxy's own TLS.
  caBundle: {configMap: "", key: ca.crt}
  # debug logs every request; info only refusals and errors (every request is recorded
  # in egress_records either way).
  logLevel: info
  resources: {}

networkPolicy:
  # Needs a network plugin that enforces NetworkPolicy.
  enabled: true
  # The cluster DNS, the one destination outside Exradius a run pod reaches directly.
  dns:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}
  # Further peers that may reach the api's port 8000 (an ingress controller), as
  # NetworkPolicy "from" entries.
  apiFrom: []
  # With builds.egress: direct, the cluster's own CIDRs (pods, services, nodes) that
  # build pods may not reach.
  clusterCIDRs: []

namespaces:
  # Create the runs and builds namespaces with their Pod Security labels. The release
  # namespace itself is created by the installer, labelled for Pod Security "restricted".
  create: true
  runs: exradius-runs
  builds: exradius-builds

runs:
  user: {uid: 1000, gid: 1000}
  # Requests of what a config declares no memory for (docs/kubernetes.md §6): the
  # workstation and setup containers, and each service. Declared memory is request and
  # limit; there is never a CPU limit.
  defaults: {memoryRequest: 1Gi, cpuRequest: 500m, serviceMemoryRequest: 256Mi, serviceCpuRequest: 100m}
  workspace: {storageClass: "", size: 50Gi}
  # One PVC per project with its git mirrors and workstation.cache directories
  # (docs/kubernetes.md §7.6), created on the project's first run and deleted with the
  # project. ReadWriteOnce suits one node; on several nodes use ReadWriteMany with an RWX
  # storage class (EFS, Filestore, Azure Files, NFS), or turn it off: clones then fetch
  # from the remote and each cache is an empty directory per run.
  projectVolume: {enabled: true, accessMode: ReadWriteOnce, storageClass: "", size: 100Gi}
  runtimeClassName: ""
  userNamespaces: false
  nodeSelector: {}
  tolerations: []
  # Names of Secrets in the runs namespace for pulling private project images.
  imagePullSecrets: []

builds:
  # Prefix of images built from Dockerfiles (docs/kubernetes.md §12): build pods push
  # <registry>/exradius/<project>/<name>:<hash> and nodes pull it from there.
  registry: ""
  # Rootless BuildKit, pinned. An Exradius builder image with the clouds' credential
  # helpers replaces it in phase 6 (builds.credentialHelper).
  builderImage: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
  # Keep each image's layer cache in the registry at <image>:buildcache (mode=max).
  cache: true
  # Registries build pods reach over plain HTTP (written into buildkitd.toml).
  insecureRegistries: []
  # The build container's resources.
  resources:
    requests: {cpu: 500m, memory: 1Gi}
  # proxy: build pods reach registries and the internet through the egress proxy (buildkitd
  # and every RUN step; chained to egress.upstreamProxy); a registry on a private address
  # needs an egress.allowPrivate entry. direct: they reach them themselves, and
  # networkPolicy.clusterCIDRs keeps them off the cluster's own addresses.
  egress: proxy
  # Rootless BuildKit creates a user namespace and mounts inside it, which the runtime's
  # default seccomp profile refuses. Empty: the build container runs with seccomp and
  # AppArmor Unconfined, and exradius-builds is labelled Pod Security "privileged". A
  # Localhost profile, relative to the kubelet's seccomp directory (for example
  # exradius/buildkit.json: deploy/seccomp/buildkit.json copied to
  # /var/lib/kubelet/seccomp/exradius/ on every node that runs builds): RuntimeDefault plus
  # those calls, and exradius-builds at "baseline" (docs/kubernetes.md §12).
  seccompProfile: ""

crds:
  # The Run and Build CRDs, kept on uninstall (helm.sh/resource-policy: keep) and upgraded
  # with the chart.
  install: true

dev:
  # Set by the Tiltfile: the backend processes run under Tilt's restart wrapper, so a live
  # update restarts them without a new image.
  restartWrapper: false
