# Exradius chart defaults (docs/kubernetes.md §16). Secrets are never values: each one is
# named by an existingSecret and read from there.

# Base URL of the API as consumers of task.result reach it (artifact and transcript links)
# and as git hosts call the config hook: the ingress's address in an install with one
# (ingress below), never localhost when a bridge runs elsewhere.
publicApiUrl: http://localhost:8000
clusterDomain: cluster.local

images:
  # Prefixed to every Exradius image: kind-registry:5000, <account>.dkr.ecr.<region>.amazonaws.com
  registry: ""
  # Tag of every Exradius image; empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  backend: exradius-backend
  frontend: exradius-frontend
  operator: exradius-operator
  egress: exradius-egress
  # Build pods' image: rootless BuildKit with the clouds' credential helpers
  # (deploy/builder.Dockerfile); builds.builderImage overrides it.
  builder: exradius-builder
  # Exradius Desk (desk below), built from bridges/desk/Dockerfile.
  desk: exradius-desk

runtime:
  claudeCode:
    # The Claude Code runtime bundle, mounted into run pods as an image volume.
    # Empty: <images.registry>/exradius-runtime-claude-code:<tag>.
    image: ""
# The image of run pods of projects that name none, and of provider probes.
# Empty: <images.registry>/exradius-project-default:<tag>.
projectDefaultImage: ""

secretKey:
  # A Fernet key (exradius generate-key) that encrypts secrets at rest.
  existingSecret: exradius-secret-key
  key: secret-key
  # Keys being rotated out, comma-separated: they only decrypt (docs/kubernetes.md §10.1).
  # Optional; absent from the Secret in an install that is not rotating.
  previousKey: previous-secret-keys
admin:
  username: admin
  # Seeds the admin user at the first start; changed in the panel after that.
  existingSecret: exradius-admin
  key: password

broker:
  # amqp://host:5672/ of a broker outside the cluster. Empty with rabbitmq.inCluster.operator.
  url: ""
  # Secret with the broker's user name and password (in-cluster: <name>-default-user).
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  # The broker as integrations reach it, shown on the integration page.
  publicHost: localhost
  publicPort: 5672

rabbitmq:
  inCluster:
    # A RabbitmqCluster for the RabbitMQ Cluster Operator, which must be installed.
    operator: true
    name: exradius-rabbitmq
    replicas: 1
    storage: 10Gi
    storageClass: ""
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 1Gi}

postgres:
  # Secret whose uriKey holds the database URL (postgresql://user:password@host:5432/db).
  # Empty with inCluster.cloudnativepg: CloudNativePG's <name>-app Secret.
  existingSecret: ""
  uriKey: uri
  inCluster:
    # A CloudNativePG Cluster; the CloudNativePG operator must be installed.
    cloudnativepg: true
    name: exradius-postgres
    instances: 1
    storage: 10Gi
    storageClass: ""
    resources: {}

objectStore:
  # s3 (SeaweedFS in the cluster, S3, any S3 API), gcs or azure (docs/kubernetes.md §14).
  kind: s3
  # The bucket, or Azure's container. In clouds the installer creates it (deploy/terraform).
  bucket: exradius
  # S3's region.
  region: us-east-1
  s3:
    # Empty: AWS S3 (or the in-cluster SeaweedFS below).
    endpoint: ""
    # Secret with an access key and a secret key. In-cluster SeaweedFS uses it too. Empty:
    # boto3's default chain, which reads EKS Pod Identity or IRSA (identity.app).
    existingSecret: exradius-objectstore
    accessKeyKey: accessKey
    secretKeyKey: secretKey
  gcs:
    # An emulator (fake-gcs-server), reached without credentials. Empty: Google Cloud
    # Storage as the GKE Workload Identity of identity.app.
    endpoint: ""
  azure:
    # The storage account; its blob endpoint is https://<account>.blob.core.windows.net
    # unless endpoint names another (Azurite).
    account: ""
    endpoint: ""
    # A Secret with the account's Shared Key, for clusters outside AKS. Empty: AKS Workload
    # Identity of identity.app ("Storage Blob Data Contributor" on the container).
    existingSecret: ""
    keyKey: accountKey
  inCluster:
    seaweedfs: true
    name: exradius-seaweedfs
    image: chrislusf/seaweedfs:4.51
    storage: 20Gi
    storageClass: ""
    resources: {}

# HashiCorp Vault for secret stores of kind vault (docs/config-repo.md §7): one Vault per
# install. The api and the worker sign in as their ServiceAccounts (exradius-api and
# exradius-worker in the release namespace) with Vault's Kubernetes auth method; Exradius
# keeps no Vault credential. Each store names a KV version 2 mount and a path, whose fields
# are its keys; the role's policy reads <mount>/data/<path> and <mount>/subkeys/<path>
# (Vault 1.10 or later). The api and the worker have no egress NetworkPolicy, so they reach
# any address Vault is on.
vault:
  # https://vault.example.com:8200. Empty: no Vault, and no store of kind vault can be made.
  address: ""
  # Where the Kubernetes auth method is enabled, and the role both sign in as.
  authMount: kubernetes
  role: exradius
  # A Vault Enterprise or HCP Vault namespace.
  namespace: ""
  # A ConfigMap in the release namespace with the CA bundle of Vault's certificate. Empty:
  # the image's CAs.
  caBundle: {configMap: "", key: ca.crt}
  # The audience of the ServiceAccount token sent to Vault. Set it (for example vault) and
  # the role's audience to match: the pods then send a projected token that only Vault
  # accepts, instead of their own, which the Kubernetes API accepts too.
  audience: ""
  # For a Vault outside the cluster: a ServiceAccount exradius-vault-reviewer allowed to
  # review tokens (system:auth-delegator), and a long-lived token for it in the Secret of the
  # same name, which Vault's admin sets as the auth method's token_reviewer_jwt. A Vault
  # inside the cluster reviews with its own ServiceAccount and needs none of it; without an
  # audience, Vault may also review with each pod's own token instead.
  tokenReviewer: false

# The cloud identities pods sign in with (EKS Pod Identity or IRSA, GKE and AKS Workload
# Identity), so no cloud key is ever in a Secret. Each is ServiceAccount annotations and pod
# labels: IRSA's eks.amazonaws.com/role-arn, GKE's iam.gke.io/gcp-service-account, AKS's
# azure.workload.identity/client-id with the pod label azure.workload.identity/use: "true".
# EKS Pod Identity and GKE's direct principal bindings need neither: they name the
# ServiceAccount (exradius/exradius-api, exradius/exradius-worker,
# exradius-builds/exradius-build). deploy/terraform writes these values.
identity:
  # The api and the worker: the object store; the worker also reads the builds registry.
  app:
    serviceAccountAnnotations: {}
    podLabels: {}
  # Build pods: push to the builds registry, nothing else.
  build:
    serviceAccountAnnotations: {}
    podLabels: {}

# Where the stack's pods run (api, worker, panel, operator, egress, and the in-cluster
# Postgres, RabbitMQ and SeaweedFS): the cloud values put them on the system node pool, so
# they never share a node with runs (runs.nodeSelector).
stack:
  nodeSelector: {}
  tolerations: []

api:
  replicas: 1
  resources: {}
  readOnlyRootFilesystem: true
worker:
  replicas: 1
  # Runs in flight per worker; RabbitMQ keeps the backlog.
  concurrency: 4
  resources: {}
  readOnlyRootFilesystem: true
frontend:
  replicas: 1
  resources: {}
operator:
  replicas: 1
  # Runs reconciled at once.
  workers: 4
  leaderElect: true
  resources: {}

# The egress proxy (docs/kubernetes.md §11): every request of run and build pods goes
# through it. Setup (clones, services, setup commands) and builds reach any public host;
# the agent reaches its model, its repositories, its connections and the hosts below plus
# each config's network.allow. Credentials stay in the proxy.
egress:
  # Every run's and build's requests go through the proxy. One replica suits one node; with
  # more, the chart spreads them over nodes and adds a PodDisruptionBudget (one down at a
  # time). Each replica watches every run pod, and the runner asks each one before the
  # agent phase (docs/kubernetes.md §11). Phase 6's cloud values use 2.
  replicas: 1
  # Hosts every run may reach in the agent phase (pypi.org; *.example.com for subdomains).
  allow: []
  # Private and cluster-internal destinations the proxy may reach: CIDRs, or host[:port].
  # Everything private (10/8, 172.16/12, 192.168/16, loopback, link-local, the cloud's
  # metadata address) is refused otherwise, in every phase. An internal package mirror, or
  # the kind registry for builds, goes here.
  allowPrivate: []
  # A corporate proxy every outbound connection goes through, http://host:port, and the
  # hosts reached without it. With credentials, name a Secret whose key holds the URL.
  upstreamProxy: ""
  upstreamProxySecret: {name: "", key: url}
  upstreamNoProxy: []
  # A ConfigMap with the CA of an intercepting upstream proxy, for the proxy's own TLS.
  caBundle: {configMap: "", key: ca.crt}
  # debug logs every request; info only refusals and errors (every request is recorded
  # in egress_records either way).
  logLevel: info
  resources: {}

networkPolicy:
  # Needs a network plugin that enforces NetworkPolicy.
  enabled: true
  # The cluster DNS, the one destination outside Exradius a run pod reaches directly.
  dns:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}
  # Further peers that may reach the api's port 8000 (an ingress controller), as
  # NetworkPolicy "from" entries.
  apiFrom: []
  # With builds.egress: direct, the cluster's own CIDRs (pods, services, nodes) that
  # build pods may not reach.
  clusterCIDRs: []
  # The cloud's pod identity endpoint, which build pods reach directly for their registry
  # credentials (builds.credentialHelper): [{cidr: 169.254.170.23/32, port: 80}] on EKS
  # (Pod Identity), [{cidr: 169.254.169.254/32, port: 80}] on GKE (the metadata server with
  # Dataplane V2). AKS's Entra ID is a public host, reached through the proxy.
  buildIdentity: []

namespaces:
  # Create the runs and builds namespaces with their Pod Security labels. The release
  # namespace itself is created by the installer, labelled for Pod Security "restricted".
  create: true
  runs: exradius-runs
  builds: exradius-builds

runs:
  user: {uid: 1000, gid: 1000}
  # Requests of what a config declares no memory for (docs/kubernetes.md §6): the
  # workstation and setup containers, and each service. Declared memory is request and
  # limit; there is never a CPU limit.
  defaults: {memoryRequest: 1Gi, cpuRequest: 500m, serviceMemoryRequest: 256Mi, serviceCpuRequest: 100m}
  workspace: {storageClass: "", size: 50Gi}
  # One PVC per project with its git mirrors and workstation.cache directories
  # (docs/kubernetes.md §7.6), created on the project's first run and deleted with the
  # project. ReadWriteOnce suits one node; on several nodes use ReadWriteMany with an RWX
  # storage class (EFS, Filestore, Azure Files, NFS), or turn it off: clones then fetch
  # from the remote and each cache is an empty directory per run.
  projectVolume: {enabled: true, accessMode: ReadWriteOnce, storageClass: "", size: 100Gi}
  # A sandbox runtime for run pods, by RuntimeClass name: "gvisor" (runsc and the
  # RuntimeClass on the nodes) makes a run's processes talk to gVisor's user-space kernel.
  # Off by default: installs and tests take about 1.5-2.5x as long (docs/kubernetes.md
  # §27); turn it on for installs that take tickets from untrusted sources. It cannot be
  # combined with userNamespaces.
  runtimeClassName: ""
  # hostUsers: false. Every uid of a run pod, a service's root included, is an
  # unprivileged uid on the node. Needs containerd 2, runc 1.2 or later and idmapped mounts
  # on the volumes' filesystems (Linux 6.3+); a node without them fails the run with a
  # diagnosis. Turn it off for a sandbox runtime (runtimeClassName: gvisor).
  userNamespaces: true
  # How run pods get the runtime bundle (docs/kubernetes.md §7.2): image, an image volume
  # (Kubernetes 1.36 with containerd 2.1 or later on the nodes), or copy, an init container
  # that copies it from the bundle image into an emptyDir (about 0.5 GB and a few seconds
  # per run pod), for nodes without image volumes.
  bundleMount: image
  nodeSelector: {}
  tolerations: []
  # Names of Secrets in the runs namespace for pulling private project images.
  imagePullSecrets: []

builds:
  # Prefix of images built from Dockerfiles (docs/kubernetes.md §12): build pods push
  # <registry>/exradius/<project>/<name>:<hash> and nodes pull it from there.
  registry: ""
  # Empty: <images.registry>/exradius-builder:<tag>, the pinned rootless BuildKit with the
  # clouds' credential helpers (deploy/builder.Dockerfile).
  builderImage: ""
  # How build pods sign in to builds.registry as their pod identity (identity.build), and
  # the worker to read built images' configs (identity.app): none (an anonymous registry,
  # kind's), ecr, gcr (Artifact Registry) or acr.
  credentialHelper: none
  # Hosts build pods reach without the egress proxy: the cloud's pod identity endpoint
  # (EKS Pod Identity's 169.254.170.23, the GKE metadata server's 169.254.169.254). The
  # matching NetworkPolicy entries are networkPolicy.buildIdentity.
  noProxy: []
  # Keep each image's layer cache in the registry at <image>:buildcache (mode=max).
  cache: true
  # Registries build pods reach over plain HTTP (written into buildkitd.toml).
  insecureRegistries: []
  # The build container's resources.
  resources:
    requests: {cpu: 500m, memory: 1Gi}
  # proxy: build pods reach registries and the internet through the egress proxy (buildkitd
  # and every RUN step; chained to egress.upstreamProxy); a registry on a private address
  # needs an egress.allowPrivate entry. direct: they reach them themselves, and
  # networkPolicy.clusterCIDRs keeps them off the cluster's own addresses.
  egress: proxy
  # Rootless BuildKit creates a user namespace and mounts inside it, which the runtime's
  # default seccomp profile refuses. Empty: the build container runs with seccomp and
  # AppArmor Unconfined, and exradius-builds is labelled Pod Security "privileged". A
  # Localhost profile, relative to the kubelet's seccomp directory (for example
  # exradius/buildkit.json: charts/exradius/files/profiles/buildkit.json copied to
  # /var/lib/kubelet/seccomp/exradius/ on every node that runs builds): RuntimeDefault plus
  # those calls, and exradius-builds at "baseline" (docs/kubernetes.md §12). Empty by default
  # because the file must be on every node first: kind's dev-up installs it, the k3s check
  # installs it by hand, and phase 6's node bootstrap will for the clouds.
  seccompProfile: ""
  # With seccompProfile, on nodes with AppArmor (Ubuntu, GKE's COS, AKS): a Localhost
  # AppArmor profile that allows mounting in the build's own user namespace, which the
  # runtime's default profile denies (charts/exradius/files/profiles/exradius-buildkit, loaded on every
  # node that runs builds). Empty: the runtime's default AppArmor profile. Empty by default
  # for the same reason as seccompProfile.
  appArmorProfile: ""

# The panel and the API from outside the cluster (docs/kubernetes.md §16): one Ingress, its
# every path to the panel's nginx, which forwards /api to the api (streams unbuffered).
# Set publicApiUrl to its address. The cloud installs use Traefik (className: traefik), as
# the k3s check does.
ingress:
  enabled: false
  className: ""
  # Empty: any host name (the load balancer's address).
  host: ""
  annotations: {}
  # [{secretName: exradius-tls, hosts: [exradius.example.com]}], with a certificate from
  # cert-manager (annotations) or made by hand.
  tls: []

# A DaemonSet that installs the build pods' profiles on every node and keeps them there
# (docs/kubernetes.md §12): files/profiles/buildkit.json into the kubelet's seccomp
# directory, and on nodes with AppArmor files/profiles/exradius-buildkit loaded with the
# node's own apparmor_parser. With it set builds.seccompProfile: exradius/buildkit.json and,
# on AppArmor nodes, builds.appArmorProfile: exradius-buildkit. It runs privileged, in a
# namespace of its own; kind's dev-up installs the seccomp profile itself instead.
nodeSetup:
  enabled: false
  namespace: exradius-node-setup
  image: busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
  # The kubelet's root directory on the nodes.
  kubeletDir: /var/lib/kubelet
  nodeSelector: {}
  # Every node, the tainted run pool's too.
  tolerations: [{operator: Exists}]

# Exradius Desk (bridges/desk/docs/design.md): Exradius's own task system and bridge. People
# sign in with OpenID Connect, keep tasks in projects whose config repositories have
# bridges/desk.yaml, and assign them to people or to Exradius. One replica, its own database.
desk:
  enabled: false
  # Desk's address as browsers reach it: links in mail, the OIDC redirect URI
  # (<publicUrl>/auth/callback), the Origin check.
  publicUrl: ""
  # An integration token for the bridge desk (panel: Settings, Integrations), in a Secret.
  integrationToken: {existingSecret: exradius-desk, key: integration-token}
  oidc:
    # The issuer, exactly as the ID tokens' iss.
    issuer: ""
    # Where Desk reads the discovery document, when it reaches the provider at another
    # address than browsers do. Empty: <issuer>/.well-known/openid-configuration.
    discoveryUrl: ""
    clientId: ""
    # A Secret with a confidential client's secret. Empty: a public client (PKCE only).
    existingSecret: ""
    secretKey: client-secret
    scopes: "openid profile email"
    # The claim with the person's groups; a dotted name reads a nested claim.
    groupsClaim: groups
  database:
    # A Secret whose uriKey holds postgresql://user:password@host:5432/db for Desk alone.
    # Empty with inCluster.cloudnativepg: that Cluster's <name>-app Secret.
    existingSecret: ""
    uriKey: uri
    inCluster:
      cloudnativepg: true
      name: exradius-desk-postgres
      instances: 1
      storage: 5Gi
      storageClass: ""
      resources: {}
  # Mail for assignments, mentions, questions and ended runs. Empty host: no mail.
  smtp:
    host: ""
    port: 587
    # starttls, tls or none.
    tls: starttls
    from: ""
    # A Secret with the user name and password, if the server wants them.
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  # Files per upload, in MB (they travel inline in the task message).
  maxAttachmentMb: 10
  sessionHours: 12
  resources: {}
  # Desk's own Ingress, on a host name of its own.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

crds:
  # The Run and Build CRDs, kept on uninstall (helm.sh/resource-policy: keep) and upgraded
  # with the chart.
  install: true

dev:
  # Set by the Tiltfile: the backend processes run under Tilt's restart wrapper, so a live
  # update restarts them without a new image.
  restartWrapper: false
