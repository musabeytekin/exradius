# Exradius stack: api, worker, frontend (admin panel), postgres and rabbitmq (with management UI).
#
#   cp deploy/.env.example deploy/.env    # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The worker starts run containers on the host's Docker daemon, attached to the
# `exradius-runs` network, where only the API is (alias exradius-api): runs reach it at
# http://exradius-api:8000 and cannot see postgres, rabbitmq or anything else of the stack.
#
# Agents run in run containers started from the project's image (any glibc-based image
# with git; exradius-project-default when a project names none), with the runtime bundle
# (exradius-runtime-claude-code) mounted read-only at /opt/exradius/runtime. Compose builds
# those two images too; their services are build-only (scale 0).
#
# Transcripts, artifacts and attachments are stored on the filesystem under
# $EXRADIUS_DATA_DIR/objects/, which both api and worker mount. To use an S3 API instead,
# set EXRADIUS_OBJECT_STORE=s3 and the EXRADIUS_S3_* variables in deploy/.env.

name: exradius

x-backend: &backend
  image: exradius-backend:0.1.0
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  user: root
  restart: unless-stopped
  environment: &backend-env
    EXRADIUS_DATABASE_URL: postgresql+asyncpg://exradius:${POSTGRES_PASSWORD:-exradius}@postgres:5432/exradius
    EXRADIUS_BROKER_URL: amqp://${RABBITMQ_USER:-exradius}:${RABBITMQ_PASSWORD:-exradius}@rabbitmq:5672/
    EXRADIUS_DATA_DIR: /var/lib/exradius
    EXRADIUS_OBJECT_STORE: ${EXRADIUS_OBJECT_STORE:-filesystem}
    EXRADIUS_S3_ENDPOINT_URL: ${EXRADIUS_S3_ENDPOINT_URL:-}
    EXRADIUS_S3_ACCESS_KEY: ${EXRADIUS_S3_ACCESS_KEY:-}
    EXRADIUS_S3_SECRET_KEY: ${EXRADIUS_S3_SECRET_KEY:-}
    EXRADIUS_S3_BUCKET: ${EXRADIUS_S3_BUCKET:-exradius}
    EXRADIUS_S3_REGION: ${EXRADIUS_S3_REGION:-us-east-1}
    EXRADIUS_PUBLIC_API_URL: ${EXRADIUS_PUBLIC_API_URL:-http://localhost:8000}
    EXRADIUS_SECRET_KEY: ${EXRADIUS_SECRET_KEY:?set EXRADIUS_SECRET_KEY in deploy/.env (exradius generate-key)}
    EXRADIUS_ADMIN_USERNAME: ${EXRADIUS_ADMIN_USERNAME:-admin}
    EXRADIUS_ADMIN_PASSWORD: ${EXRADIUS_ADMIN_PASSWORD:?set EXRADIUS_ADMIN_PASSWORD in deploy/.env}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  api:
    <<: *backend
    working_dir: /opt/exradius
    entrypoint: ["/bin/sh", "-c", "alembic upgrade head && exec exradius-api"]
    environment:
      <<: *backend-env
      # Broker address as integrations reach it, for the integration page.
      EXRADIUS_PUBLIC_BROKER_HOST: ${EXRADIUS_PUBLIC_BROKER_HOST:-localhost}
      EXRADIUS_PUBLIC_BROKER_PORT: ${EXRADIUS_PUBLIC_BROKER_PORT:-${EXRADIUS_AMQP_PORT:-5672}}
      # Legacy: an ANTHROPIC_API_KEY left in an older deploy/.env becomes the default
      # provider "Anthropic (migrated)" at the first start without providers; it is not
      # read after that. Providers are managed in the admin panel.
      EXRADIUS_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      default: {}
      runs:
        aliases: [exradius-api]
    ports:
      - "${EXRADIUS_API_PORT:-8000}:8000"
    volumes:
      - ${EXRADIUS_DATA_DIR:-/var/lib/exradius}:/var/lib/exradius
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    entrypoint: ["exradius-worker"]
    environment:
      <<: *backend-env
      # Run directories are bind-mounted into run containers by the host's Docker daemon,
      # so the worker must know the host path of its data directory.
      EXRADIUS_HOST_DATA_DIR: ${EXRADIUS_DATA_DIR:-/var/lib/exradius}
      EXRADIUS_WORKER_CONCURRENCY: ${EXRADIUS_WORKER_CONCURRENCY:-4}
      EXRADIUS_RUNTIME_IMAGE_CLAUDE_CODE: ${EXRADIUS_RUNTIME_IMAGE_CLAUDE_CODE:-exradius-runtime-claude-code:0.1.0}
      EXRADIUS_PROJECT_DEFAULT_IMAGE: ${EXRADIUS_PROJECT_DEFAULT_IMAGE:-exradius-project-default:0.1.0}
      # Runs join exradius-runs only (plus their own network when the project has
      # services); the worker itself stays off it.
      EXRADIUS_RUN_NETWORK: exradius-runs
      EXRADIUS_RUN_API_URL: http://exradius-api:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${EXRADIUS_DATA_DIR:-/var/lib/exradius}:/var/lib/exradius
    depends_on:
      api:
        condition: service_healthy

  # Build-only: the Claude Code runtime bundle, which the worker extracts into a volume.
  runtime-claude-code:
    image: ${EXRADIUS_RUNTIME_IMAGE_CLAUDE_CODE:-exradius-runtime-claude-code:0.1.0}
    build:
      context: ..
      dockerfile: deploy/runtime-claude-code.Dockerfile
      args:
        EXRADIUS_VERSION: 0.1.0
    scale: 0

  # Build-only: the image of run containers for projects that name no image.
  project-default:
    image: ${EXRADIUS_PROJECT_DEFAULT_IMAGE:-exradius-project-default:0.1.0}
    build:
      context: ..
      dockerfile: deploy/project-default.Dockerfile
    scale: 0

  frontend:
    image: exradius-frontend:latest
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      # nginx serves the panel and proxies /api here, so the session cookie is same-origin.
      EXRADIUS_API_UPSTREAM: http://api:8000
    ports:
      - "${EXRADIUS_FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: exradius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exradius}
      POSTGRES_DB: exradius
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EXRADIUS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exradius -d exradius"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exradius}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-exradius}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "${EXRADIUS_AMQP_PORT:-5672}:5672"
      - "${EXRADIUS_RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

networks:
  default:
    name: exradius
  # Runs and the API only. Not internal: runs need outbound network access.
  runs:
    name: exradius-runs

volumes:
  postgres:
  rabbitmq:
