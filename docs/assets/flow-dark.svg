                   keyPoints="0;0;0.5;0.5;1;1" keyTimes="0;0.555;0.58;0.62;0.645;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.555;0.561;0.645;0.651;1" dur="14s" repeatCount="indefinite"/>
