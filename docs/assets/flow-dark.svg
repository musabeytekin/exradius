      <path d="M0 0 L10 5 L0 10 z" fill="#6E7681"/>
    </marker>
    <marker id="no-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F85149"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="578" rx="16" fill="#161B22" stroke="#30363D"/>

