  <text x="354" y="162" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9198A1">found</text>
  <text x="544" y="162" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9198A1">yes</text>
  <text x="652" y="300" text-anchor="start" font-size="11.5" font-weight="600" fill="#9198A1">chosen</text>
  <text x="272" y="106" text-anchor="start" font-size="11.5" font-weight="600" fill="#9198A1">none</text>
  <text x="462" y="106" text-anchor="start" font-size="11.5" font-weight="600" fill="#9198A1">no</text>
  <text x="652" y="106" text-anchor="start" font-size="11.5" font-weight="600" fill="#9198A1">none</text>
  <rect x="20" y="132" width="150" height="76" rx="12" fill="#221E3F" stroke="#8B7FFF" stroke-width="1.5"/>
  <rect class="anim" x="20" y="132" width="150" height="76" rx="12" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.006;0.05;0.056;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="95.0" y="165.5" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">You assign a ticket</text>
  <text x="95.0" y="182.5" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">to the agent</text>
  <rect x="180" y="34" width="160" height="54" rx="10" fill="#2D1517" stroke="#F85149" stroke-width="1.2"/>
  <text x="260.0" y="55" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6EDF3">Not an Exradius project</text>
  <text x="260.0" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">the ticket says so</text>
  <polygon points="260,120 332,170 260,220 188,170" fill="#0D1117" stroke="#8B7FFF" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon class="anim" points="260,120 332,170 260,220 188,170" fill="#8B7FFF" fill-opacity="0.16" stroke="#8B7FFF" stroke-width="3" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.085;0.091;0.14;0.146;1" dur="14s" repeatCount="indefinite"/></polygon>
  <text x="260" y="167" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">Which</text>
  <text x="260" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">project?</text>
  <rect x="370" y="34" width="160" height="54" rx="10" fill="#2D1517" stroke="#F85149" stroke-width="1.2"/>
  <text x="450.0" y="55" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6EDF3">Config or secret missing</text>
  <text x="450.0" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">refused, with the reason</text>
  <polygon points="450,120 522,170 450,220 378,170" fill="#0D1117" stroke="#8B7FFF" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon class="anim" points="450,120 522,170 450,220 378,170" fill="#8B7FFF" fill-opacity="0.16" stroke="#8B7FFF" stroke-width="3" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.175;0.181;0.23;0.236;1" dur="14s" repeatCount="indefinite"/></polygon>
  <text x="450" y="167" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">Project</text>
  <text x="450" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">ready?</text>
  <rect x="560" y="34" width="160" height="54" rx="10" fill="#2D1517" stroke="#F85149" stroke-width="1.2"/>
  <text x="640.0" y="55" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6EDF3">No agent can be chosen</text>
  <text x="640.0" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">refused, with the reason</text>
  <polygon points="640,120 712,170 640,220 568,170" fill="#0D1117" stroke="#8B7FFF" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon class="anim" points="640,120 712,170 640,220 568,170" fill="#8B7FFF" fill-opacity="0.16" stroke="#8B7FFF" stroke-width="3" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.265;0.271;0.34;0.346;1" dur="14s" repeatCount="indefinite"/></polygon>
  <text x="640" y="167" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">Which</text>
  <text x="640" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">agent?</text>
  <rect x="760" y="104" width="180" height="136" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect class="anim" x="760" y="104" width="180" height="136" rx="10" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.265;0.271;0.34;0.346;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="774" y="126" text-anchor="start" font-size="12.5" font-weight="700" fill="#8B7FFF">How it picks</text>
  <text x="774" y="146.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">Named on the ticket: that one.</text>
  <text x="774" y="161.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">Otherwise it compares the</text>
  <text x="774" y="177.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">ticket with each agent's role</text>
  <text x="774" y="192.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">and tools, and takes the best</text>
  <text x="774" y="208.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">match. Unsure? It still runs,</text>
  <text x="774" y="223.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">and says that it guessed.</text>
  <rect x="520" y="360" width="240" height="80" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect class="anim" x="520" y="360" width="240" height="80" rx="12" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.386;0.46;0.466;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="640.0" y="387.0" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">A workstation of its own</text>
  <text x="640.0" y="404.0" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">code cloned, services started,</text>
  <text x="640.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">setup run</text>
  <rect x="545" y="480" width="215" height="54" rx="10" fill="#2D1517" stroke="#F85149" stroke-width="1.2"/>
  <text x="652.5" y="501" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6EDF3">Setup fails</text>
  <text x="652.5" y="518" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">the task stops, naming the cause</text>
  <rect x="320" y="356" width="170" height="88" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect class="anim" x="320" y="356" width="170" height="88" rx="12" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.506;0.7;0.706;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="405.0" y="387.0" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">The agent works</text>
  <text x="405.0" y="404.0" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">on the ticket, reaching</text>
  <text x="405.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">only allowed sites</text>
  <rect x="290" y="478" width="230" height="70" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect class="anim" x="290" y="478" width="230" height="70" rx="10" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.555;0.561;0.645;0.651;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="405" y="499" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6EDF3">Missing information?</text>
  <text x="405" y="517" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">It asks on the ticket and waits;</text>
  <text x="405" y="532" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9198A1">your reply picks up where it stopped</text>
  <polygon points="228,350 300,400 228,450 156,400" fill="#0D1117" stroke="#8B7FFF" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon class="anim" points="228,350 300,400 228,450 156,400" fill="#8B7FFF" fill-opacity="0.16" stroke="#8B7FFF" stroke-width="3" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.735;0.741;0.79;0.796;1" dur="14s" repeatCount="indefinite"/></polygon>
  <text x="228" y="397" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">May it</text>
  <text x="228" y="414" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF3">push?</text>
  <rect x="130" y="478" width="150" height="70" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect class="anim" x="130" y="478" width="150" height="70" rx="10" fill="#8B7FFF" fill-opacity="0.14" stroke="#8B7FFF" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.735;0.741;0.79;0.796;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="144" y="499" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">Yes: a branch and</text>
  <text x="144" y="515" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">a pull request</text>
  <text x="144" y="531" text-anchor="start" font-size="11.5" font-weight="400" fill="#9198A1">No: a patch instead</text>
  <rect x="20" y="352" width="122" height="96" rx="12" fill="#12261E" stroke="#3FB950" stroke-width="1.5"/>
  <rect class="anim" x="20" y="352" width="122" height="96" rx="12" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.83;0.836;0.97;0.976;1" dur="14s" repeatCount="indefinite"/></rect>
  <text x="81.0" y="378.5" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Result on</text>
  <text x="81.0" y="395.5" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">the ticket</text>
  <text x="81.0" y="412.5" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">back to you</text>
  <text x="81.0" y="429.5" text-anchor="middle" font-size="12" font-weight="400" fill="#9198A1">to review</text>
