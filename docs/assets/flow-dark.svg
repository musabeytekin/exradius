  <text x="898" y="183" text-anchor="end" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198A1">pnpm install</text>
  <rect x="690" y="204" width="220" height="36" rx="10" fill="#221E3F" stroke="#30363D" stroke-width="1.2"/>
  <rect class="anim" x="690" y="204" width="220" height="36" rx="10" fill="#8B7FFF" fill-opacity="0.16" stroke="#8B7FFF" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.516;0.79;0.796;1" dur="9s" repeatCount="indefinite"/>
  </rect>
