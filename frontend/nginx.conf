# Rendered by the nginx image's envsubst step: only ${EXRADIUS_API_UPSTREAM} and
# ${EXRADIUS_RESOLVER} are replaced; nginx's own $variables are left alone. The image runs
# unprivileged (uid 101), so it listens on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API's name per request (cached 10 s), not once at start, so the panel
    # keeps working when the api is recreated with a new address. The resolver is the
    # pod's own nameserver from /etc/resolv.conf unless EXRADIUS_RESOLVER names one; it
    # does not apply search domains, so EXRADIUS_API_UPSTREAM is a fully qualified name.
    resolver ${EXRADIUS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream ${EXRADIUS_API_UPSTREAM};

    # Large enough for task and answer attachments sent from the panel as base64.
    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # A variable makes nginx resolve at request time; with no URI part the request
        # path is passed through unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-sent events (task stream): no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Connection tests start an MCP server and wait up to 60 s.
        proxy_send_timeout 120s;
    }

    # Hashed assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
