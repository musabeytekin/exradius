[project]
name = "exradius-bridge-kit"
version = "0.1.0"
description = "A library for bridges between work trackers and Exradius"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.4",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "exradius_bridge_kit"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
